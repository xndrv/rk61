<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">RK61 custom firmware — small board, your rules</title>
  <desc id="description">An illustrated 61-key keyboard with green, blue, magenta and yellow layer keys, and a magenta Esc connection indicator.</desc>
